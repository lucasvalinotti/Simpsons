<header class="site-header">
  <div class="header-content">
    <a class="brand" routerLink="/home" aria-label="Springfield, ir al inicio">
      <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <circle cx="24" cy="24" r="21" fill="#241d35" />
        <circle cx="22" cy="21" r="18" fill="#f6a825" />
        <path d="M6 20C6 11 13 4 22 4c8 0 16 6 18 14-3 1-3 5-6 5-2 0-2-3-5-3s-3 4-6 4-3-3-6-3-3 4-6 4c-2 0-3-3-5-5Z"
          fill="#fa67b6" />
        <circle cx="22" cy="21" r="6" fill="#241d35" />
        <circle cx="22" cy="21" r="3.5" fill="#ffdf4b" />
        <path d="m13 14 2 1m15-6 1 2m-18 18 2-1m16 0 1-2m-11-15 1 2m12 3-2 1" stroke="#241d35" stroke-width="2"
          stroke-linecap="round" />
        <circle cx="20" cy="6" r="1.5" fill="#53caec" />
        <circle cx="9" cy="20" r="1.5" fill="#53caec" />
        <circle cx="28" cy="15" r="1.5" fill="#53caec" />
      </svg>
      <span class="brand-name">SPRINGFIELD!</span>
    </a>

    <nav class="navigation" aria-label="Navegación principal">
      <a class="nav-link" routerLink="/characters" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">Personajes</a>
      <a class="nav-link favorites-link" routerLink="/favorites" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">♡</span>
        <span>Favoritos</span>
        <span class="favorites-count" [attr.aria-label]="favorites.ids().size + ' favoritos'">{{ favorites.ids().size }}</span>
      </a>
    </nav>
  </div>
</header>
