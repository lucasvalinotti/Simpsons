<main class="characters-page characters-list-page">
  <div class="page-content">
    <h1>Favoritos</h1>
    <p class="subtitle">Tus vecinos favoritos de Springfield en un solo lugar.</p>

    @if (favoritesService.favorites().length) {
      <div class="cards-grid">
        @for (favorite of favoritesService.favorites(); track favorite.id) {
          <app-character-card [character]="favorite" [isFavorite]="favoritesService.isFavorite(favorite.id)"
            (favoriteToggle)="favoritesService.toggleFavorites(favorite)" />
        }
      </div>
    } @else {
      <app-no-results-state [favoritesEmpty]="true" />
    }

  </div>
</main>
